name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install DirectX SDK
        shell: powershell
        run: choco install directx-sdk --version 9.29.1962.02 --yes --no-progress

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x86

      - name: Build client and server
        shell: powershell
        run: |
          $directXSdk = Join-Path ${env:ProgramFiles(x86)} 'Microsoft DirectX SDK (June 2010)'
          if (-not (Test-Path $directXSdk)) {
            throw "DirectX SDK was not installed at $directXSdk"
          }
          $env:DXSDK_DIR = "$directXSdk\"
          $env:CL = '/DSAMP_DL'
          msbuild sampvoice.sln /m /p:Configuration=Release /p:Platform=x86 /p:PreferredToolArchitecture=x86

      - name: Package Windows builds
        shell: powershell
        run: |
          $requiredFiles = @('bin/sampvoice.asi', 'bin/sampvoice.dll')
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Expected build output was not produced: $file"
            }
          }

          New-Item -ItemType Directory -Force -Path artifacts/client, artifacts/server/plugins, artifacts/server/pawno/include | Out-Null
          Copy-Item bin/sampvoice.asi, setup/files/*.dll artifacts/client/
          Copy-Item bin/sampvoice.dll artifacts/server/plugins/
          Copy-Item server/sampvoice.inc artifacts/server/pawno/include/
          Copy-Item server/sampvoice.hnd artifacts/server/

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: sampvoice-client-windows-x86
          path: artifacts/client
          if-no-files-found: error

      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: sampvoice-server-windows-x86
          path: artifacts/server
          if-no-files-found: error

  linux:
    name: Linux x86
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install 32-bit build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-multilib

      - name: Build server
        working-directory: server
        run: make

      - name: Package Linux build
        run: |
          test -f server/sampvoice.so
          mkdir -p artifacts/server/plugins artifacts/server/pawno/include
          cp server/sampvoice.so artifacts/server/plugins/
          cp server/sampvoice.inc artifacts/server/pawno/include/
          cp server/sampvoice.hnd artifacts/server/

      - name: Upload Linux server
        uses: actions/upload-artifact@v4
        with:
          name: sampvoice-server-linux-x86
          path: artifacts/server
          if-no-files-found: error